<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Wichtig: target-densitydpi=device-dpi und force-device-scale zwingen Android dazu, nicht zu zoomen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, target-densitydpi=device-dpi">
    <title>Wortuhr - Color</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000; /* Tiefschwarz */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
        }

        /* Das Gehäuse der Uhr - Passt sich jetzt absolut sauber an beide Richtungen an */
        .clock-case {
            display: grid;
            grid-template-rows: repeat(10, 1fr);
            gap: 1vmin;
            background-color: #000000;
        }

        /* Wenn das Handy SENKRECHT gehalten wird (Breite ist kleiner als Höhe) */
        @media (orientation: portrait) {
            .clock-case {
                width: 90vw;
                height: 90vw;
            }
            .letter {
                font-size: 5vw;
            }
        }

        /* Wenn das Handy WAAGERECHT gehalten wird (Höhe ist kleiner als Breite) */
        @media (orientation: landscape) {
            .clock-case {
                width: 90vh;
                height: 90vh;
            }
            .letter {
                font-size: 5vh;
            }
        }

        /* Eine Zeile im Raster */
        .row {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 1vmin;
        }

        /* Inaktive Buchstaben */
        .letter {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a; /* Dunkles Anthrazit */
            font-weight: 400;
            letter-spacing: 0.05em;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        /* Aktive Buchstaben mit dem weißen Neon-Glow */
        .letter.active {
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="clock-case" id="matrix"></div>

    <script>
        const grid = [
            ["E","S","K","I","S","T","L","F","Ü","N","F"],
            ["Z","E","H","N","Z","W","A","N","Z","I","G"],
            ["D","R","E","I","V","I","E","R","T","E","L"],
            ["T","G","N","A","C","H","V","O","R","J","M"],
            ["H","A","L","B","Q","Z","W","Ö","L","F","P"],
            ["Z","W","E","I","N","S","I","E","B","E","N"],
            ["K","D","R","E","I","R","H","F","Ü","N","F"],
            ["E","L","F","N","E","U","N","V","I","E","R"],
            ["W","A","C","H","T","Z","E","H","N","R","S"],
            ["B","S","E","C","H","S","F","M","U","H","R"]
        ];

        grid[7][10] = "R"; 

        const words = {
            'ES':       [0, [0, 1]],
            'IST':      [0, [3, 5]],
            'mFÜNF':    [0, [7, 10]],
            'mZEHN':    [1, [0, 3]],
            'mZWANZIG': [1, [4, 10]],
            'VIERTEL':  [2, [4, 10]],
            'NACH':     [3, [2, 5]],
            'VOR':      [3, [6, 8]],
            'HALB':     [4, [0, 3]],
            'h12':      [4, [5, 9]],
            'h2':       [5, [0, 3]],
            'h1_uhr':   [5, [2, 4]],
            'h1':       [5, [2, 5]],
            'h7':       [5, [5, 10]],
            'h3':       [6, [1, 4]],
            'h5':       [6, [7, 10]],
            'h11':      [7, [0, 2]],
            'h9':       [7, [3, 6]],
            'h4':       [7, [7, 10]],
            'h8':       [8, [1, 4]],
            'h10':      [8, [5, 8]],
            'h6':       [9, [1, 5]],
            'UHR':      [9, [8, 10]]
        };

        const matrixContainer = document.getElementById('matrix');
        grid.forEach((row, rIdx) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            row.forEach((letter, cIdx) => {
                const span = document.createElement('div');
                span.className = 'letter';
                span.textContent = letter;
                span.id = `cell-${rIdx}-${cIdx}`;
                rowDiv.appendChild(span);
            });
            matrixContainer.appendChild(rowDiv);
        });

        function getRandomColor() {
            const r = Math.floor(Math.random() * 156) + 100;
            const g = Math.floor(Math.random() * 156) + 100;
            const b = Math.floor(Math.random() * 156) + 100;
            return `rgb(${r}, ${g}, ${b})`;
        }

        function updateClock() {
            document.querySelectorAll('.letter').forEach(el => {
                el.classList.remove('active');
                el.style.color = '';
                el.style.textShadow = '';
            });

            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const roundedMinutes = Math.floor(minutes / 5) * 5;
            
            let displayHour = hours % 12;
            if (displayHour === 0) displayHour = 12;

            if (roundedMinutes >= 25) {
                displayHour = (displayHour % 12) + 1;
            }

            const activeWords = ['ES', 'IST'];

            switch (roundedMinutes) {
                case 0:  activeWords.push('UHR'); break;
                case 5:  activeWords.push('mFÜNF', 'NACH'); break;
                case 10: activeWords.push('mZEHN', 'NACH'); break;
                case 15: activeWords.push('VIERTEL', 'NACH'); break;
                case 20: activeWords.push('mZWANZIG', 'NACH'); break;
                case 25: activeWords.push('mFÜNF', 'VOR', 'HALB'); break;
                case 30: activeWords.push('HALB'); break;
                case 35: activeWords.push('mFÜNF', 'NACH', 'HALB'); break;
                case 40: activeWords.push('mZWANZIG', 'VOR'); break;
                case 45: activeWords.push('VIERTEL', 'VOR'); break;
                case 50: activeWords.push('mZEHN', 'VOR'); break;
                case 55: activeWords.push('mFÜNF', 'VOR'); break;
            }

            if (displayHour === 1) {
                if (roundedMinutes === 0) {
                    activeWords.push('h1_uhr');
                } else {
                    activeWords.push('h1');
                }
            } else {
                activeWords.push(`h${displayHour}`);
            }

            activeWords.forEach(wordKey => {
                const coord = words[wordKey];
                if (coord) {
                    const row = coord[0];
                    const start = coord[1][0];
                    const end = coord[1][1];

                    for (let col = start; col <= end; col++) {
                        const cell = document.getElementById(`cell-${row}-${col}`);
                        if (cell) {
                            cell.classList.add('active');
                            const uniqueColor = getRandomColor();
                            cell.style.color = uniqueColor;
                            cell.style.textShadow = `
                                0 0 4px ${uniqueColor},
                                0 0 10px ${uniqueColor},
                                0 0 20px ${uniqueColor}`;
                        }
                    }
                }
            });
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
